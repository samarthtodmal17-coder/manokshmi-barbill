[package]
name = "manokshmi-barbill"
version = "0.1.13"
description = "Manokshmi BarBill - bar billing and management (Tauri desktop, SQLite)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2" }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
machine-uid = "0.6"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
